schemaVersion: "2.0.0"

metadataTest:
  exposedPorts: []

commandTests:
  - name: "python is installed in the path"
    command: "python"
    args: ["--version"]
    expectedOutput: ["Python 3.12"]

  - name: "git is installed in path"
    command: "git"
    args: ["--version"]
    expectedOutput: ["git version"]

  - name: "ssh is installed in path"
    command: "ssh"
    args: ["-V"]
    expectedError: ["OpenSSH"]

  - name: "uv is installed in path"
    command: "uv"
    args: ["--version"]
    expectedOutput: ["uv"]

  - name: "shellcheck is installed in path"
    command: "shellcheck"
    args: ["--version"]
    expectedOutput: ["shellcheck"]

  - name: "hadolint is installed in path"
    command: "hadolint"
    args: ["--version"]

  - name: "shfmt is installed in path"
    command: "shfmt"
    args: ["--version"]

  - name: "snyk is installed in path"
    command: "snyk"
    args: ["--version"]

  - name: "reviewdog is installed in path"
    command: "reviewdog"
    args: ["--version"]

  - name: "actionlint is installed in path"
    command: "actionlint"
    args: ["--version"]

  - name: "taplo is installed in path"
    command: "taplo"
    args: ["--version"]

  - name: "watchman is installed in path"
    command: "watchman"
    args: ["--version"]

  - name: "ONBUILD was executed"
    command: "ruff"
    args: ["--version"]

  - name: "ripgrep is installed in path"
    command: "rg"
    args: ["--version"]

  - name: "fd is installed in path"
    command: "fd"
    args: ["--version"]

  - name: "btop is installed in path"
    command: "btop"
    args: ["--version"]

  - name: "eza is installed in path"
    command: "eza"
    args: ["--version"]

  - name: "ls is overridden by eza"
    command: "ls"
    args: ["--version"]
    expectedOutput: ["eza"]

  - name: "dust is installed in path"
    command: "dust"
    args: ["--version"]

  - name: "bat is installed in path"
    command: "bat"
    args: ["--version"]

  - name: "delta is installed in path"
    command: "delta"
    args: ["--version"]

  - name: "fzf is installed in path"
    command: "fzf"
    args: ["--version"]

  - name: "tokei is installed in path"
    command: "tokei"
    args: ["--version"]

  - name: "hyperfine is installed in path"
    command: "hyperfine"
    args: ["--version"]

  - name: "postgresql support is available"
    command: "psql"
    args: ["--version"]
    expectedOutput: ["PostgreSQL"]

  - name: "nodejs is installed in path"
    command: "node"
    args: ["--version"]
    expectedOutput: ["v2"] # Node 20+ outputs "v2x.x.x"

  - name: "odbc support is available"
    command: "odbcinst"
    args: ["-j"]
    expectedOutput: ["unixODBC"]

  - name: "freetds support is available"
    command: "odbcinst"
    args: ["-q", "-d", "-n", "FreeTDS"]
    expectedOutput: ["FreeTDS"]

  - name: "wget is installed in path"
    command: "wget"
    args: ["--version"]
    expectedOutput: ["GNU Wget"]

  - name: "curl is installed in path"
    command: "curl"
    args: ["--version"]
    expectedOutput: ["curl"]

  - name: "jq is installed in path"
    command: "jq"
    args: ["--version"]
    expectedOutput: ["jq"]

  - name: "java is installed in path"
    command: "java"
    args: ["--version"]
    expectedOutput: ["openjdk"]
