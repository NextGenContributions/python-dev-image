schemaVersion: "2.0.0"

metadataTest:
  exposedPorts: []

commandTests:
  - name: "python is installed in the path"
    command: "python"
    args: ["--version"]
    expectedOutput: ["Python 3.12"]

  - name: "git is installed in path"
    command: "git"
    args: ["--version"]
    expectedOutput: ["git version"]

  - name: "ssh is installed in path"
    command: "ssh"
    args: ["-V"]
    expectedError: ["OpenSSH"]

  - name: "uv is installed in path"
    command: "uv"
    args: ["--version"]
    expectedOutput: ["uv"]

  - name: "shellcheck is installed in path"
    command: "shellcheck"
    args: ["--version"]
    expectedOutput: ["shellcheck"]

  - name: "hadolint is installed in path"
    command: "hadolint"
    args: ["--version"]

  - name: "shfmt is installed in path"
    command: "shfmt"
    args: ["--version"]

  - name: "snyk is installed in path"
    command: "snyk"
    args: ["--version"]

  - name: "pulumi is installed in path"
    command: "pulumi"
    args: ["version"]

  - name: "reviewdog is installed in path"
    command: "reviewdog"
    args: ["--version"]

  - name: "actionlint is installed in path"
    command: "actionlint"
    args: ["--version"]

  - name: "watchman is installed in path"
    command: "watchman"
    args: ["--version"]

  - name: "ONBUILD was executed"
    command: "ruff"
    args: ["--version"]

  - name: "psql is installed in path"
    command: "psql"
    args: ["--version"]
